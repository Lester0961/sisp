services:
  - type: web
    name: sisp-backend
    env: node
    rootDir: sisp-backend
    buildCommand: pnpm install && npx prisma generate && pnpm build
    startCommand: pnpm start:prod
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: PORT
        value: "3001"
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        sync: false # Set this to https://sisp-rmc.vercel.app
      - key: ADDITIONAL_CORS_ORIGINS
        sync: false # Keep the previous Vercel alias during migration
      - key: MFA_ENABLED
        value: "true"
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: BREVO_SENDER_NAME
        sync: false
      - key: RATE_LIMIT_PROFILE
        value: production

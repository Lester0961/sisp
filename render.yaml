services:
  - type: web
    name: sisp-backend
    env: node
    rootDir: sisp-backend
    buildCommand: pnpm install && npx prisma generate && pnpm build
    startCommand: pnpm start:prod
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: PORT
        value: "3001"
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        sync: false # Set this to https://sisp-rmc.vercel.app
      - key: ADDITIONAL_CORS_ORIGINS
        sync: false # Keep the previous Vercel alias during migration
      - key: MFA_ENABLED
        value: "true"
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: BREVO_SENDER_NAME
        sync: false
      - key: RATE_LIMIT_PROFILE
        value: production
      - key: ML_SERVICE_URL
        sync: false # Set to the deployed sisp-ml service URL
      - key: ML_SECRET_TOKEN
        sync: false # Must match the sisp-ml service secret
      # Treasury payment channels (P6-04). Set only from official school
      # announcements; leave unset to show the "contact Treasury" message.
      - key: PAYMENT_CHANNEL_GCASH_NUMBER
        sync: false
      - key: PAYMENT_CHANNEL_GCASH_NAME
        sync: false
      - key: PAYMENT_CHANNEL_GCASH_NOTE
        sync: false
      - key: PAYMENT_CHANNEL_PNB_ACCOUNT
        sync: false
      - key: PAYMENT_CHANNEL_PNB_NAME
        sync: false
      - key: PAYMENT_PROOF_RECIPIENT_NAME
        sync: false
      - key: PAYMENT_PROOF_RECIPIENT_OFFICE
        sync: false
      - key: PAYMENT_PROOF_RECIPIENT_INSTRUCTION
        sync: false

  # ARIA's hybrid NLP, retrieval, moderation, and LLM-router service.
  # Keep provider credentials in Render's encrypted environment settings;
  # never commit them to this blueprint or the repository.
  - type: web
    name: sisp-ml
    env: python
    rootDir: sisp-ml
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PORT
        value: "8000"
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GOOGLE_AI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: qwen/qwen3.6-27b
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: OPENROUTER_MODEL
        value: openrouter/free
      - key: NVIDIA_MODEL
        value: z-ai/glm-5.3-flash
      - key: LLM_PROVIDER_ORDER
        value: nvidia
      - key: LLM_REQUEST_TIMEOUT_SECONDS
        value: "18"
      - key: NVIDIA_REQUEST_TIMEOUT_SECONDS
        value: "35"
      - key: LLM_MAX_TOKENS
        value: "280"
      - key: GROQ_ENABLED
        value: "false"
      - key: GEMINI_ENABLED
        value: "false"
      - key: OPENROUTER_ENABLED
        value: "false"
      - key: NVIDIA_ENABLED
        value: "true"
      - key: ADVISORY_SUPPORTED_LANGUAGES
        value: en,fil,ceb,ilo,hil,war
      - key: RETRIEVAL_SIMILARITY_THRESHOLD
        value: "0.3"
      - key: REQUIRE_PGVECTOR
        value: "true"
      - key: ML_SECRET_TOKEN
        sync: false

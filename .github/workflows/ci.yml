name: SISP CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (typecheck + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sisp-backend
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sisp
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/sisp
      JWT_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: sisp-backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit
      - run: npx jest --silent --runInBand

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sisp-frontend
    env:
      NEXT_PUBLIC_API_URL: http://localhost:3001/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: sisp-frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

  ml:
    name: ARIA ML (compile + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sisp-ml
    env:
      ML_SECRET_TOKEN: ci-ml-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: sisp-ml/requirements.txt
      - run: pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m compileall app
      - run: python -m pytest -q
